# MONITORS - https://wiki.hyprland.org/Configuring/Monitors/
# Native
monitorv2 {
  output = eDP-1
  mode = preferred
  position = 0x0
  scale = 1.0666667
  bitdepth = 16
}
# External
monitorv2 {
  output = HDMI-A-1
  mode = 1920x1080@100.00
  position = auto-up
  scale = 1
  bitdepth = 10
}
monitorv2 {
  output = desc:Dell Inc. DELL SE2425HM HRJMZ64
  mode = 1920x1080@100.00
  position = auto-up
  scale = 1
  bitdepth = 10
}
# monitor=DP-1,1920x1080@100.00,0x-1080,1, bitdepth, 10, cm, auto
# monitor=DP-2,1920x1080@100.00,0x-1080,1, bitdepth, 10, cm, auto
monitorv2 {
  output = desc:Invalid Vendor Codename - RTK HG556J03 0x01010101
  mode = 1920x1080@60
  position = auto-right
  scale = 1.2
  bitdepth = 16
  cm = auto
}

# PLUGINS - https://hypr.land/plugins/
plugin:hyprglass {
    default_theme = light
    default_preset = glass
    
    layers:enabled = 1
    layers:preset = glass

    brightness = 0.8

    preset = name:glass, glass_opacity:0.8, blur_strength:2.0, blur_iterations:5, chromatic_aberration:0.1, fresnel_strength:0.3, specular_strength:0.4, edge_thickness:0.02, tint_color:0x1e1e2e22, vibrancy:0.1969, saturation:1.0
}

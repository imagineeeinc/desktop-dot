source=~/.config/hypr/mocha.conf
$font = SpaceMono Nerd Font
general {
  hide_cursor = false
}
auth {
  fingerprint:enabled = true
  fingerprint:ready_message = "Swipe fingerprint to unlock"
  fingerprint:retry_delay = 1000
}

background {
  monitor =
  path = ~/Pictures/wallpaper/wallpaper.png
  color = $crust
  blur_size = 3
  blur_passes = 3
  contrast = 0.7
  brightness = 0.5
  noise = 0.08
  color = $base
}
label {
  monitor =
  text = cmd[update:30000] echo "$(date +"%R")"
  color = rgba($textAlphac0)
  font_size = 110
  font_family = $font
  position = 0, 250
  halign = center
  valign = center
}
label {
  monitor =
  text = cmd[update:30000] echo "$(date +"%d/%m")"
  color = rgba($overlay2Alpha80)
  font_size = 40
  font_family = $font
  position = 0, 150
  halign = center
  valign = center
}
label {
  monitor =
  text = cmd[update:30000] ~/.config/hypr/scripts/battery_percentage.sh
  color = $overlay2
  font_size = 24
  font_family = $font
  position = -20, 20
  halign = right
  valign = bottom
}
# image {
#   monitor = 
#   path = ~/.face

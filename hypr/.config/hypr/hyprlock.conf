#   rounding = 10
#   border_size = 2
#   border_color = $sapphire
# 
#   position = 0, 75
#   halign = center
#   valign = center
# }
input-field {
  monitor =
  size = 300, 50
  rounding = 10
  outline_thickness = 2
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = rgba($overlay0Alpha80)
  inner_color = rgba($surface0Alpha80)
  font_color = $text
  fade_on_empty = false
  placeholder_text = 󰌾 $USER
  hide_input = false
  check_color = $teal $green
  fail_color = $maroon $red
  fail_text = $FAIL ($ATTEMPTS)
  capslock_color = $yellow
  position = 0, 20
  halign = center
  valign = bottom
}
shape {
  monitor =
  color = rgba($surface0Alpha80)
  border_size = 2
  border_color = rgba($overlay0Alpha80)
  size = 205, 50
  rounding = 10
  position = 20, 20
  halign = left
  valign = bottom
  zindex = -1
}
label {
  monitor =
  text = <span> </span>
  color = $overlay2
  font_size = 25
  font_family = $font
  position = 35, 20
  halign = left
  valign = bottom
  onclick = shutdown now
}
label {
  monitor =
  text = <span>󰜉 </span>
  color = $overlay2
  font_size = 25
  font_family = $font
  position = 85, 20
  halign = left
  valign = bottom
  onclick = reboot
}
label {
  monitor =
  text = <span>󰤄 </span>
  color = $overlay2
  font_size = 25
  font_family = $font
  position = 135, 20
  halign = left
  valign = bottom
  onclick = systemctl suspend
}
label {
  monitor =
  text = <span>󰗼 </span>
  color = $overlay2
  font_size = 25
  font_family = $font
  position = 185, 20
  halign = left
  valign = bottom
  onclick = hyprctl dispatch exit
}
